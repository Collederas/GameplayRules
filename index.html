<title>Echo Choir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Layout: the whole screen is a pitch staff; voices live on it. One quiet caption and a clear button. */
  :root {
    --bg: #ebe9f1;
    --fg: #24212f;
    --staff: #d3cfdf;
    --staff-root: #b3acc8;
    --muted: #6d6782;
    --type-ui: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15131c; --fg: #e8e5f1; --staff: #25222f; --staff-root: #3a3550; --muted: #8f88a8; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #15131c; --fg: #e8e5f1; --staff: #25222f; --staff-root: #3a3550; --muted: #8f88a8; color-scheme: dark; }

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--type-ui);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .hud {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
    pointer-events: none;
    font-size: 12px; letter-spacing: 0.03em; color: var(--muted);
  }
  .hud p { margin: 0; max-width: 44ch; line-height: 1.5; padding-left: 28px; }
  .hud b { color: var(--fg); font-weight: 500; }
  button {
    pointer-events: auto;
    font: inherit; color: var(--fg);
    background: transparent;
    border: 1px solid var(--staff-root);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>

<canvas id="stage" aria-label="Pitch staff. Press and drag to sing; release to leave a looping echo."></canvas>
<div class="hud">
  <p id="hint"><b>Press and drag to sing.</b> Height is pitch. Let go and your gesture keeps singing as an echo, on loop. Layer them.</p>
  <button id="clear" type="button">Clear <span id="count">0</span></button>
</div>

<script>
(() => {
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  const countEl = document.getElementById('count');
  const cs = getComputedStyle(document.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- music ----
  const BPM = 96, BEAT = 60 / BPM;
  // C major pentatonic, two octaves + top C (MIDI)
  const NOTES = [48, 50, 52, 55, 57, 60, 62, 64, 67, 69, 72];
  const NAMES = ['C3', 'D3', 'E3', 'G3', 'A3', 'C4', 'D4', 'E4', 'G4', 'A4', 'C5'];
  const MAX_ECHOES = 10;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  let W = 0, H = 0, DPR = 1;
  let audio = null;          // { ac, master }
  const echoes = [];         // looping recorded voices
  let live = null;           // the voice under your finger
  let hueSeed = Math.random() * 360;

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  }

  // staff spans a vertical band leaving room for the HUD
  const top = () => 70, bottom = () => H - 30;
  const noteIndexAt = ny => {
    const i = Math.round((1 - ny) * (NOTES.length - 1));
    return Math.max(0, Math.min(NOTES.length - 1, i));
  };
  const yForIndex = i => top() + (1 - i / (NOTES.length - 1)) * (bottom() - top());
  const normY = y => (y - top()) / (bottom() - top());

  function now() { return audio ? audio.ac.currentTime : performance.now() / 1000; }

  function initAudio() {
    if (audio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const master = ac.createGain(); master.gain.value = 0.5;
    const comp = ac.createDynamicsCompressor();
    // a little space: feedback delay
    const delay = ac.createDelay(1); delay.delayTime.value = BEAT * 0.75;
    const fb = ac.createGain(); fb.gain.value = 0.3;
    const wet = ac.createGain(); wet.gain.value = 0.25;
    master.connect(comp);
    master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(comp);
    comp.connect(ac.destination);
    audio = { ac, master };
  }

  function makeVoice(level) {
    if (!audio) return null;
    const { ac, master } = audio;
    const osc = ac.createOscillator(); osc.type = 'triangle';
    const sub = ac.createOscillator(); sub.type = 'sine';
    const filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 1800; filt.Q.value = 2;
    const g = ac.createGain(); g.gain.value = 0;
    const subG = ac.createGain(); subG.gain.value = 0.35;
    const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    osc.connect(filt); sub.connect(subG); subG.connect(filt); filt.connect(g);
    if (pan) { g.connect(pan); pan.connect(master); } else g.connect(master);
    osc.start(); sub.start();
    return { osc, sub, filt, g, pan, level, note: -1, on: false };
  }

  function voiceSet(v, idx, nx, on) {
    if (!v) return;
    const t = audio.ac.currentTime;
    if (idx !== v.note) {
      const f = mtof(NOTES[idx]);
      v.osc.frequency.setTargetAtTime(f, t, 0.012);
      v.sub.frequency.setTargetAtTime(f / 2, t, 0.012);
      v.note = idx;
      // re-articulate on each new note
      if (on) { v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.level * 0.55, t); v.g.gain.linearRampToValueAtTime(v.level, t + 0.02); }
    }
    if (on !== v.on) { v.g.gain.setTargetAtTime(on ? v.level : 0, t, on ? 0.01 : 0.06); v.on = on; }
    if (v.pan) v.pan.pan.setTargetAtTime((nx - 0.5) * 1.4, t, 0.05);
    v.filt.frequency.setTargetAtTime(700 + 2600 * (idx / (NOTES.length - 1)), t, 0.05);
  }

  function killVoice(v) {
    if (!v || !audio) return;
    const t = audio.ac.currentTime;
    v.g.gain.setTargetAtTime(0, t, 0.08);
    v.osc.stop(t + 0.6); v.sub.stop(t + 0.6);
  }

  // ---- echoes ----
  function samplePath(pts, p) {
    // pts sorted by t; return last point with t <= p
    let lo = 0, hi = pts.length - 1;
    if (p < pts[0].t) return null;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (pts[mid].t <= p) lo = mid; else hi = mid - 1; }
    return pts[lo];
  }

  function addEcho(rec) {
    const dur = rec.pts[rec.pts.length - 1].t;
    if (dur < 0.12) return;
    const len = Math.max(1, Math.ceil(dur / BEAT)) * BEAT;
    const t = now();
    const t0 = Math.ceil(t / BEAT) * BEAT; // start on the next beat
    const e = { pts: rec.pts, dur, len, t0, hue: rec.hue, voice: makeVoice(0.16), cur: null, flash: 0, born: performance.now() };
    echoes.push(e);
    while (echoes.length > MAX_ECHOES) killVoice(echoes.shift().voice);
    countEl.textContent = echoes.length;
  }

  function clearAll() {
    for (const e of echoes) killVoice(e.voice);
    echoes.length = 0; countEl.textContent = 0;
  }

  // ---- input ----
  function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / W, normY(e.clientY - r.top)]; }

  cv.addEventListener('pointerdown', e => {
    initAudio();
    if (audio && audio.ac.state === 'suspended') audio.ac.resume();
    cv.setPointerCapture(e.pointerId);
    const [nx, ny] = pos(e);
    hueSeed = (hueSeed + 137.5) % 360;
    live = { start: now(), pts: [], hue: hueSeed, nx, ny, voice: makeVoice(0.24), flash: 0, note: -1 };
    record();
  });
  cv.addEventListener('pointermove', e => { if (!live) return; [live.nx, live.ny] = pos(e); });
  const release = () => {
    if (!live) return;
    record();
    killVoice(live.voice);
    addEcho(live);
    live = null;
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  document.getElementById('clear').addEventListener('click', clearAll);
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') clearAll();
    if ((e.key === 'Backspace' || e.key === 'z') && echoes.length) { killVoice(echoes.pop().voice); countEl.textContent = echoes.length; }
  });

  function record() {
    if (!live) return;
    const t = now() - live.start;
    const ny = Math.max(0, Math.min(1, live.ny)), nx = Math.max(0, Math.min(1, live.nx));
    live.pts.push({ t, x: nx, y: ny });
    const idx = noteIndexAt(ny);
    if (idx !== live.note) { live.note = idx; live.flash = 1; }
    voiceSet(live.voice, idx, nx, true);
  }

  // ---- draw ----
  function color(h, a = 1) { return `hsla(${h}, 72%, 58%, ${a})`; }

  function drawStaff(beatPhase) {
    ctx.fillStyle = tok('--bg'); ctx.fillRect(0, 0, W, H);
    ctx.font = `11px ${tok('--type-ui')}`; ctx.textBaseline = 'middle';
    for (let i = 0; i < NOTES.length; i++) {
      const y = Math.round(yForIndex(i)) + 0.5;
      const root = NAMES[i][0] === 'C';
      ctx.strokeStyle = tok(root ? '--staff-root' : '--staff'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(44, y); ctx.lineTo(W, y); ctx.stroke();
      ctx.fillStyle = tok('--muted');
      ctx.fillText(NAMES[i], 12, y);
    }
    // beat ticks along the bottom: 4 per bar, current one lit
    const beatIdx = Math.floor(now() / BEAT) % 4;
    for (let b = 0; b < 4; b++) {
      ctx.fillStyle = tok(b === beatIdx ? '--fg' : '--staff-root');
      const r = b === beatIdx && !reduceMotion ? 3 + 2 * (1 - beatPhase) : 3;
      ctx.beginPath(); ctx.arc(W - 70 + b * 16, H - 14, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawPath(pts, hue, alpha, upTo) {
    if (pts.length < 2) return;
    ctx.strokeStyle = color(hue, alpha); ctx.lineWidth = 2; ctx.lineJoin = ctx.lineCap = 'round';
    ctx.beginPath();
    let started = false;
    for (const p of pts) {
      if (upTo != null && p.t > upTo) break;
      const x = p.x * W, y = yForIndex(noteIndexAt(p.y));
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function drawDot(x, y, hue, size, flash) {
    if (flash > 0.01) {
      ctx.fillStyle = color(hue, 0.25 * flash);
      ctx.beginPath(); ctx.arc(x, y, size + 22 * (1 - flash) + 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = color(hue);
    ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
  }

  let lastFrame = performance.now();
  function frame(tms) {
    const dt = Math.min(0.05, (tms - lastFrame) / 1000); lastFrame = tms;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const t = now();
    const beatPhase = (t / BEAT) % 1;
    drawStaff(beatPhase);

    for (const e of echoes) {
      const p = t - e.t0;
      let pt = null;
      if (p >= 0) { const ph = p % e.len; if (ph <= e.dur) pt = samplePath(e.pts, ph); }
      drawPath(e.pts, e.hue, 0.18);
      if (pt) {
        const idx = noteIndexAt(pt.y);
        if (!e.cur || noteIndexAt(e.cur.y) !== idx) e.flash = 1;
        e.cur = pt;
        voiceSet(e.voice, idx, pt.x, true);
        drawDot(pt.x * W, yForIndex(idx), e.hue, 7, reduceMotion ? 0 : e.flash);
      } else {
        if (e.cur) { voiceSet(e.voice, e.voice ? e.voice.note : 0, e.cur.x, false); e.cur = null; }
      }
      e.flash = Math.max(0, e.flash - dt * 4);
    }

    if (live) {
      record();
      drawPath(live.pts, live.hue, 0.8);
      const idx = noteIndexAt(live.ny);
      drawDot(Math.max(0, Math.min(1, live.nx)) * W, yForIndex(idx), live.hue, 10, reduceMotion ? 0 : live.flash);
      live.flash = Math.max(0, live.flash - dt * 4);
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
